<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🩺 Doctor Assistant</h1>
    <span id="status" class="status">Checking connection…</span>
  </header>

  <main>
    <section class="panel left">
      <h2>Image</h2>
      <label id="dropzone" class="dropzone">
        <input id="fileInput" type="file" accept="image/*" hidden>
        <img id="preview" alt="" hidden>
        <span id="dropText">Drag an image here or click to select<br><small>X-ray, CT, MRI, dermatology photo, ECG…</small></span>
      </label>

      <button id="analyzeBtn" class="primary" disabled>Analyze</button>
      <button id="resetBtn" class="secondary">New Patient</button>
    </section>

    <section class="panel right">
      <h2>Assistant</h2>
      <div id="chat" class="chat">
        <div class="placeholder">Upload an image and click <b>Analyze</b>. You can then ask follow-up questions.</div>
      </div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" placeholder="Type a follow-up question… (e.g. Which antibiotic would you recommend?)" disabled>
        <button class="primary" disabled id="sendBtn">Send</button>
      </form>
      <p class="disclaimer">⚠️ This system only provides decision support. The diagnosis and treatment decision always belong to the physician.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
